name: Configure Supabase on Vercel

on:
  workflow_dispatch:

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upsert Supabase env on Vercel + redeploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node <<'NODE'
          const token = process.env.VERCEL_TOKEN;
          const teamId = process.env.VERCEL_ORG_ID;
          const projectId = process.env.VERCEL_PROJECT_ID;
          const vars = {
            SUPABASE_URL: process.env.SUPABASE_URL,
            SUPABASE_SERVICE_ROLE_KEY: process.env.SUPABASE_SERVICE_ROLE_KEY
          };
          for (const [k, v] of Object.entries({ token, teamId, projectId, ...vars })) {
            if (!v) {
              console.error("Missing required value:", k);
              process.exit(1);
            }
          }

          async function api(path, opts = {}) {
            const url = new URL("https://api.vercel.com" + path);
            if (teamId) url.searchParams.set("teamId", teamId);
            const r = await fetch(url, {
              ...opts,
              headers: {
                Authorization: "Bearer " + token,
                "Content-Type": "application/json",
                ...(opts.headers || {})
              }
            });
            const text = await r.text();
            let json = null;
            try { json = JSON.parse(text); } catch {}
            if (!r.ok) {
              throw new Error(`${opts.method || "GET"} ${path} -> ${r.status} ${text.slice(0, 400)}`);
            }
            return json;
          }

          (async () => {
            const listed = await api(`/v9/projects/${projectId}/env`);
            const envs = listed.envs || [];
            for (const [key, value] of Object.entries(vars)) {
              const existing = envs.find((e) => e.key === key);
              const body = {
                value,
                type: "encrypted",
                target: ["production", "preview", "development"]
              };
              if (existing) {
                console.log("Updating", key);
                await api(`/v9/projects/${projectId}/env/${existing.id}`, {
                  method: "PATCH",
                  body: JSON.stringify(body)
                });
              } else {
                console.log("Creating", key);
                await api(`/v10/projects/${projectId}/env`, {
                  method: "POST",
                  body: JSON.stringify({ key, ...body })
                });
              }
            }

            console.log("Triggering production redeploy...");
            const { execFileSync } = require("child_process");
            const fs = require("fs");
            fs.mkdirSync(".vercel", { recursive: true });
            fs.writeFileSync(
              ".vercel/project.json",
              JSON.stringify({ projectId, orgId: teamId })
            );
            execFileSync(
              "npx",
              ["--yes", "vercel@39.4.2", "deploy", "--prod", "--yes", `--token=${token}`],
              { stdio: "inherit", env: process.env }
            );
            console.log("done");
          })().catch((e) => {
            console.error(e.message || e);
            process.exit(1);
          });
          NODE
